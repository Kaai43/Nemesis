[package]
name = "nemesis"
version = "0.1.0"
edition = "2021"
description = "Nemesis — MVP com Tauri + React, tema escuro, conta e painel RPG"

[dependencies]
# Contrato Tauri IPC
tauri = { version = "2", features = [] }
tauri-plugin-log = "2"

# Serialização dos comandos de IPC e do estado RPG
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[profile.release]
opt-level = 2
